<!--
Build an app that is functionally similar to this example project. Try not to copy the example project, give it your own personal style.

Objective: Fulfill the user stories below and get all the tests to pass to complete the lab.

User Stories:

You should have an h1 element with the text Checkout.
You should have two section elements immediately after the h1 element.
You should have an h2 element with the text Your Cart within the first section.
You should have an image of an item in the first section with appropriate alternate text. You can use this image if you would like: https://cdn.freecodecamp.org/curriculum/labs/cube.jpg
You should have an h2 element with the text Payment Information within the second section.
You should have a form element within the second section.
You should have an input with an id and name of card-name, and a type of text within your form and a label associated with it.
You should have an input with an id and name of card-number, and a type of text within your form and a label associated with it.
You should have at least two input elements with the required attribute.
You should include a span element with the text * and aria-hidden set to true inside the label element for each required input, so that required fields are visually indicated.
You should have a p element with a help text that explains the required card number format, placed immediately after the card number input. The p should have an id of card-number-help and be referenced by the card number input using aria-describedby.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img 
         src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg"
         alt="An unsolved Rubik's cube against a plain white background."
         width="307"
         height="192"
        >
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Cardholder Name<span aria-hidden="true">*</span></label>
            <input id="card-name" name="card-name" type="text" required>
            <br>
            <label for="card-number">Card Number<span aria-hidden="true">*</span></label>
            <input 
             id="card-number" 
             name="card-number" 
             type="text" 
             required
             aria-describedby="card-number-help"
            >
            <p id="card-number-help">Please enter a valid 16-digit payment card number excluding spaces and dashes.</p>
        </form>
    </section>
</body>

</html>
