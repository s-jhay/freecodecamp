<!--
Build an app that is functionally similar to this example project. Try not to copy the example project, give it your own personal style.

Objective: Fulfill the user stories below and get all the tests to pass to complete the lab.

User Stories:

You should have a DOCTYPE declaration.
You should have an html element with lang set to en.
You should have a head element containing a meta void element with charset set to utf-8 and a title with the text Travel Agency Page.
You should have a meta tag in your head element that contains a short description of your website for SEO.
You should have an h1 element to present your travel destinations. It should be the only h1 element on your page.
You should have a paragraph below the h1 element introducing the travel opportunities.
You should have an h2 element with the text Packages.
You should have a p element introducing briefly the various packages.
You should have an unordered list element with two list items. The two list items should have the text Group Travels and Private Tours, respectively. The text of each list item should be enclosed by an anchor element.
You should have an h2 element with the text Top Itineraries.
You should have at least three figure elements, each containing an anchor element and a figcaption element that describes the figure's image.
The three anchor elements should have an img element with an appropriate alt attribute and a src attribute set to a valid image as their content. 
You can use https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg, https://cdn.freecodecamp.org/curriculum/labs/alps.jpg, and https://cdn.freecodecamp.org/curriculum/labs/sea.jpg if you would like.
All your five anchor elements should have an href attribute with the value of https://www.freecodecamp.org/learn and a target attribute with the value of _blank.
-->

<!doctype html>
<html lang="en">
  <head>
    <title>Travel Agency Page</title>
    <meta name="description" content="Discover your travel destination for tomorrow, today."/>
    <meta charset="utf-8"/>
  </head>
  <body>
    <h1>Bob's Travel Agency</h1>
    <p>Come see our finest travel destinations, handpicked by Bob himself.</p>

    <h2>Packages</h2>
    <p>We have the best rates for comparable travel packages, check out our top options.</p>
    <ul>
      <li><a href="https://www.freecodecamp.org/learn" target="_blank">Group Travels</a></li>
      <li><a href="https://www.freecodecamp.org/learn" target="_blank">Private Tours</a></li>
    </ul>

    <h2>Top Itineraries</h2>
    <figure>
      <a href="https://www.freecodecamp.org/learn" target="_blank">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg" alt="An image of the Colosseum"/>
      </a>
      <figcaption>Guided tours in Rome</figcaption>
    </figure>
    <figure>
      <a href="https://www.freecodecamp.org/learn" target="_blank">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg" alt="An image from the Alps"/>
      </a>
      <figcaption> Hiking trips through the Alps</figcaption>
    </figure>
    <figure>
      <a href="https://www.freecodecamp.org/learn" target="_blank">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg" alt="An image of a boat in the sea"/>
      </a>
      <figcaption>Relaxing boat rides in the Carribean</figcaption>
    </figure>
  </body>
</html>
